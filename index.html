<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Majoo POS Enterprise</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --primary: #00b96b;
      --primary-hover: #009656;
      --bg-app: #f4f6f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --danger: #ef4444;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-app); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }

    .app-layout { display: flex; height: 100vh; }

    /* SIDEBAR */
    .sidebar {
      width: 240px; background: var(--surface); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; padding: 20px 15px; justify-content: flex-start; flex-shrink: 0;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-logo {
      width: 42px; height: 42px; background: var(--primary); color: white;
      border-radius: 12px; display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; font-weight: 800;
    }
    .brand-title { font-size: 1.15rem; font-weight: 800; }
    .brand-title span { color: var(--primary); }

    .nav-list { display: flex; flex-direction: column; gap: 6px; margin-top: 30px; }
    .nav-link {
      display: flex; align-items: center; gap: 12px; padding: 12px 16px;
      color: var(--text-sub); text-decoration: none; font-weight: 600; font-size: 0.9rem;
      border-radius: 10px; transition: all 0.2s; cursor: pointer;
    }
    .nav-link:hover, .nav-link.active { background: #e6f8f0; color: var(--primary); }

    /* CONTENT VIEWPORT */
    .content-viewport { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; }
    .loader { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-sub); font-weight: 600; }

    /* POS LAYOUT */
    .pos-container { display: flex; flex: 1; gap: 20px; height: 100%; overflow: hidden; }
    .pos-main { flex: 1; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }

    .search-bar {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 18px; display: flex; align-items: center; gap: 12px;
    }
    .search-bar input { border: none; outline: none; width: 100%; font-size: 0.95rem; }

    /* KATEGORI SCROLL */
    .cat-wrapper {
      display: flex; gap: 10px; overflow-x: auto;
      padding: 4px 15px 8px 4px; margin-right: -15px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .cat-wrapper::-webkit-scrollbar { display: none; }

    .cat-btn {
      border: 1px solid var(--border); background: var(--surface);
      padding: 8px 18px; border-radius: 20px; font-weight: 600; font-size: 0.85rem;
      color: var(--text-sub); cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .cat-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    .grid-products { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; }
    .card-product {
      background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
      padding: 12px; cursor: pointer; transition: all 0.2s; display: flex; flex-direction: column;
    }
    .card-product:hover { transform: translateY(-3px); box-shadow: 0 8px 15px rgba(0,0,0,0.05); }
    .product-name { font-weight: 700; font-size: 0.88rem; margin-bottom: 4px; }
    .product-price { color: var(--primary); font-weight: 800; font-size: 0.95rem; margin-top: auto; }

    /* CART PANEL */
    .cart-panel {
      width: 340px; background: var(--surface); border: 1px solid var(--border);
      display: flex; flex-direction: column; border-radius: 14px; flex-shrink: 0;
    }
    .cart-header { padding: 18px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; }
    .cart-list { flex: 1; padding: 18px; overflow-y: auto; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .btn-qty { width: 26px; height: 26px; border: 1px solid var(--border); background: white; border-radius: 6px; cursor: pointer; font-weight: 700; }

    .cart-summary { padding: 18px; border-top: 1px solid var(--border); background: #f8fafc; border-radius: 0 0 14px 14px; }
    .summary-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.88rem; color: var(--text-sub); }
    .summary-item.total { font-size: 1.1rem; font-weight: 800; color: var(--text-main); margin-top: 8px; }

    .payment-methods { display: flex; gap: 8px; margin: 12px 0; }
    .pay-opt {
      flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 8px;
      background: white; text-align: center; font-size: 0.8rem; font-weight: 700; cursor: pointer;
    }
    .pay-opt.active { border-color: var(--primary); background: #e6f8f0; color:var(--primary); }

    .btn-checkout {
      width: 100%; padding: 14px; background: var(--primary); color: white;
      border: none; border-radius: 10px; font-weight: 800; cursor: pointer;
    }

    /* GENERAL COMPONENTS */
    .card-box { background: var(--surface); padding: 20px; border-radius: 14px; border: 1px solid var(--border); }
    .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .form-group input, .form-group select { padding: 10px; border: 1px solid var(--border); border-radius: 8px; outline: none; }
    .btn-primary { background: var(--primary); color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    th, td { padding: 12px; border-bottom: 1px solid var(--border); text-align: left; font-size: 0.9rem; }
    th { background: #f8fafc; }

    .stat-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
    .stat-card { background: var(--surface); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
    .stat-card h4 { color: var(--text-sub); font-size: 0.85rem; margin-bottom: 8px; }
    .stat-card p { font-size: 1.4rem; font-weight: 800; color: var(--primary); }

    /* RESPONSIVE HP */
    @media (max-width: 768px) {
      body { overflow-y: auto; }
      .app-layout { flex-direction: column; height: auto; }
      .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--border); padding: 12px 15px; }
      .nav-list { flex-direction: row; margin-top: 12px; overflow-x: auto; padding-bottom: 5px; }
      .nav-link { padding: 8px 14px; font-size: 0.82rem; white-space: nowrap; flex-shrink: 0; }
      .content-viewport { padding: 12px; height: auto; overflow: visible; }
      .pos-container { flex-direction: column; height: auto; overflow: visible; }
      .pos-main { overflow: visible; }
      .grid-products { grid-template-columns: repeat(2, 1fr); gap: 10px; }
      .cart-panel { width: 100%; height: auto; margin-top: 15px; }
      .stat-cards { grid-template-columns: 1fr; }
    }

    /* FORMAT PRINT/STRUK TERMAL */
    @media print {
      body { background: #fff !important; color: #000 !important; font-size: 12px; }
      .sidebar, .pos-main, .payment-methods, .btn-checkout, .btn-qty, .cart-header button {
        display: none !important;
      }
      .app-layout, .content-viewport, .pos-container {
        display: block !important; padding: 0 !important; margin: 0 !important; width: 100% !important;
      }
      .cart-panel {
        width: 100% !important; max-width: 280px !important; margin: 0 auto !important;
        border: none !important; box-shadow: none !important;
      }
      .cart-header { text-align: center; border-bottom: 1px dashed #000 !important; }
      .cart-summary { background: transparent !important; border-top: 1px dashed #000 !important; padding: 10px 0 !important; }
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo"><i class="fa-solid fa-cash-register"></i></div>
        <div class="brand-title">Majoo<span>PRO</span></div>
      </div>
      <nav class="nav-list">
        <a class="nav-link active" onclick="loadPage('pos', this)"><i class="fa-solid fa-store"></i> POS Kasir</a>
        <a class="nav-link" onclick="loadPage('inventory', this)"><i class="fa-solid fa-boxes-stacked"></i> Stok & Produk</a>
        <a class="nav-link" onclick="loadPage('reports', this)"><i class="fa-solid fa-chart-line"></i> Laporan</a>
      </nav>
    </aside>

    <main id="main-content" class="content-viewport">
      <div class="loader">Memuat halaman...</div>
    </main>
  </div>

  <script src="js/app.js"></script>
  <script src="js/router.js"></script>
</body>
</html>
